apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vm-rbac-policy-admin
  namespace: policies
rules:
- apiGroups:
  - policy.open-cluster-management.io
  resources:
  - policies
  - policysets
  - placementbindings
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vm-rbac-policy-admin
  namespace: policies
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vm-rbac-policy-admin
subjects:
- kind: ServiceAccount
  name: openshift-gitops-argocd-application-controller
  namespace: openshift-gitops
