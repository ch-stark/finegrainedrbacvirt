# Hub ClusterRole: full VM admin permissions for the Fleet Virtualization UI.
# Layer this role with kubevirt.io:admin, acm-vm-extended:admin, and
# acm-vm-cluster-migration:view via the MulticlusterRoleAssignment below.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: custom-vm-full-admin-role
  labels:
    rbac.open-cluster-management.io/filter: vm-clusterroles
    clusterview.open-cluster-management.io/discoverable: "true"
rules:
  - apiGroups:
      - kubevirt.io
    resources:
      - virtualmachines
      - virtualmachineinstances
      - virtualmachineinstancereplicasets
      - virtualmachineinstancemigrations
      - virtualmachineinstancepresets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - subresources.kubevirt.io
    resources:
      - virtualmachines/start
      - virtualmachines/stop
      - virtualmachines/restart
      - virtualmachines/addvolume
      - virtualmachines/removevolume
      - virtualmachineinstances/console
      - virtualmachineinstances/vnc
      - virtualmachineinstances/pause
      - virtualmachineinstances/unpause
      - virtualmachineinstances/freeze
      - virtualmachineinstances/unfreeze
      - virtualmachineinstances/softreboot
      - virtualmachineinstances/guestosinfo
    verbs:
      - get
      - update
  - apiGroups:
      - cdi.kubevirt.io
    resources:
      - datavolumes
      - datasources
      - dataimportcrons
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - namespaces
      - persistentvolumeclaims
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
