apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: custom-vm-storage-role
rules:
  - apiGroups:
      - cdi.kubevirt.io
    resources:
      - datavolumes
      - datasources
      - dataimportcrons
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - subresources.kubevirt.io
    resources:
      - virtualmachines/addvolume
      - virtualmachines/removevolume
    verbs:
      - update
  - apiGroups:
      - kubevirt.io
    resources:
      - virtualmachines
    verbs:
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - namespaces
      - persistentvolumeclaims
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
